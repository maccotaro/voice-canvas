[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-canva"
version = "0.1.0"
description = "Voice Canvas（声のCanva）— 8つの特徴のスライダーで声をデザインし、元の音声をその声に変換するツール"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Voice Canva Team" }]
dependencies = [
    "pyworld>=0.3.0",
    "praat-parselmouth>=0.4.3",
    "pyopenjtalk>=0.3.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scikit-learn>=1.2.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "gradio>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/voice-canva/voice-canva"

[tool.setuptools]
packages = ["voice_canva"]
